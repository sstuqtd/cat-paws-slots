<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#261842"><meta name="description" content="猫爪漫游：跨界主题猫咪三消与幸运转盘休闲游戏">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>猫爪漫游 · Paws Across Worlds</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div class="brand"><div class="brand-mark">🐾</div><div><div class="brand-name">猫爪漫游</div><div class="brand-sub">PAWS ACROSS WORLDS</div></div></div><div class="top-actions"><select id="languageSelect" class="language-select" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select><button class="icon-btn" id="soundBtn" aria-label="切换音效">♫</button></div></header>
    <section class="hero-card"><div class="hero-copy"><span class="eyebrow" data-i18n="weeklyWorld">本周跨界世界</span><h1 id="worldTitle">月球喵喵站</h1><p id="worldDesc">戴上宇航头盔，收集星星鱼干！</p><div class="world-dots"><i class="active"></i><i></i><i></i><i></i></div></div><div class="hero-cat" aria-hidden="true">🐱‍🚀</div><div class="planet planet-a"></div><div class="planet planet-b"></div></section>
    <section class="stats"><div><span class="stat-icon">🪙</span><b id="coinCount">120</b><small data-i18n="fishCoins">鱼币</small></div><div><span class="stat-icon">⭐</span><b id="starCount">0</b><small data-i18n="stars">星星</small></div><button id="dailyBtn" class="daily-btn">🎁 每日礼物</button></section>
    <nav class="tabs"><button class="tab active" data-tab="match">🐾 三消冒险</button><button class="tab" data-tab="slots">🎰 幸运喵喵</button></nav>
    <section id="matchPanel" class="panel">
      <div class="level-row"><div><span class="eyebrow">第 1 站 · 月球基地</span><h2>收集星星鱼干</h2></div><div class="moves"><b id="movesLeft">18</b><small>步数</small></div></div>
      <div class="goal-row"><span data-i18n="goal">本关目标</span><span>⭐ <b id="goalScore">0</b> / 450</span><div class="progress"><i id="goalProgress"></i></div></div>
      <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="三消棋盘"></div><div id="toast" class="toast" aria-live="polite"></div></div>
      <div class="booster-row"><button class="booster" data-boost="shuffle">🔀<span>洗牌</span><em>🪙 30</em></button><button class="booster" data-boost="paw">🐾<span>猫爪清除</span><em>🪙 50</em></button><button class="booster" data-boost="extra">➕<span>加 5 步</span><em>🪙 40</em></button></div>
      <p class="tip">交换相邻猫咪，连成 3 个或更多即可消除 ✨</p>
    </section>
    <section id="slotsPanel" class="panel hidden">
      <div class="level-row"><div><span class="eyebrow">跨界扭蛋机</span><h2>转出旅途惊喜</h2></div><div class="moves"><b>🎁</b><small>今日好运</small></div></div>
      <div class="slot-scene"><div class="slot-top">✨ PAWS JACKPOT ✨</div><div class="reels"><div class="reel" id="reel0">🐟</div><div class="reel" id="reel1">🌙</div><div class="reel" id="reel2">⭐</div></div><div class="slot-message" id="slotMessage">每次旋转花费 20 鱼币</div><button id="spinBtn" class="spin-btn">转一下 · 🪙 20</button><div class="slot-win"><span data-i18n="threeMatch">三连相同：赢取</span> <b>100</b> <span data-i18n="fishCoins">鱼币</span>！</div></div>
      <div class="collection"><h3>今日旅行收藏</h3><div id="collectionItems" class="collection-items"><span>🐟</span><span>🌙</span><span>⭐</span><span>🧶</span><span>🚀</span></div></div>
      <p class="tip">轻松玩一局，收集跨界世界里的猫咪惊喜。</p>
    </section>
    <footer>一爪跨界，快乐连连 ✦ <span>DEMO · 进度保存在本机</span></footer>
  </main>
  <div id="modal" class="modal hidden"><div class="modal-card"><div id="modalEmoji">🎉</div><h2 id="modalTitle">太棒了！</h2><p id="modalText"></p><button id="modalClose" class="spin-btn">继续冒险</button></div></div>
  <script src="i18n.js"></script><script src="game.js"></script>
</body></html>
